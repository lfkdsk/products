<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>lfkdsk · 产品集</title>
    <meta name="description" content="lfkdsk 亲手做的工具、应用与服务" />
    <meta name="color-scheme" content="light dark" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23ffffff'/><text x='50' y='74' font-size='72' font-family='Georgia,serif' font-weight='400' fill='%230040ff' text-anchor='middle'>l</text></svg>"
    />
    <script>
      // 首帧就定好主题，避免亮/暗闪一下。
      try {
        var t = localStorage.getItem("theme");
        document.documentElement.dataset.theme =
          t === "light" || t === "dark"
            ? t
            : matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
      } catch (e) {
        document.documentElement.dataset.theme = "light";
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Inter+Tight:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/css/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="#top">lfkdsk</a>
      <nav class="topbar-right">
        <a href="https://github.com/lfkdsk" target="_blank" rel="noopener">GitHub</a>
        <button id="themeToggle" type="button" aria-label="切换深色 / 浅色">
          <span data-when="light">暗色</span><span data-when="dark">亮色</span>
        </button>
      </nav>
    </header>

    <main id="top">
      <section class="intro">
        <h1>
          你好，我是 lfkdsk。<br />
          这些是我亲手做的一些小东西 ——<br />
          工具、应用与服务，<em>都还活着</em>。
        </h1>
        <p class="intro-meta" id="introMeta"></p>
      </section>

      <div id="sections"></div>

      <section class="empty-state" id="emptyState" hidden>
        <p>还没有产品。在 <code>data/products.js</code> 里加第一个吧。</p>
      </section>
    </main>

    <footer class="footer">
      <span>© <span id="year"></span> lfkdsk</span>
      <a href="https://github.com/lfkdsk" target="_blank" rel="noopener">github.com/lfkdsk</a>
    </footer>

    <script src="data/products.js"></script>
    <script src="assets/js/app.js"></script>
  </body>
</html>
